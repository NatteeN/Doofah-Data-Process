name: Publish experimental nowcast to KV

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4 # ปรับเวอร์ชัน action ให้เป็นมาตรฐาน (เช่น v4)

      - name: Set up Python
        uses: actions/setup-python@v5 # ปรับเวอร์ชัน action ให้สอดคล้องกัน
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate nowcast JSON
        run: python update_nowcast.py
        env:
          # ส่ง Secret เข้าไปให้ Python (รองรับชื่อทั้งแบบสั้นและแบบยาวตามที่อัปเดตในสคริปต์ Python)
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          NOWCAST_KV_NAMESPACE_ID: ${{ secrets.NOWCAST_KV_NAMESPACE_ID }}
          NOWCAST_OUT_DIR: ./dist_nowcast
          GITHUB_ACTIONS: "true"

      - name: Validate nowcast output
        shell: bash
        run: |
          set -euo pipefail
          # ตรวจสอบไฟล์ metadata หรือ frames ที่สคริปต์ generate ออกมา
          test -s ./dist_nowcast/nowcast_metadata.json || { echo 'Missing nowcast metadata output.'; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('./dist_nowcast/nowcast_metadata.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(f'Valid Nowcast Metadata: {p.stat().st_size} bytes')
          PY

      - name: Write the latest nowcast to Workers KV via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # ตัวอย่างการอัปโหลดไฟล์ผ่าน wrangler (หรือใช้สคริปต์ Python อัปโหลดแบบ bulk ตามที่เราเขียนไว้ใน update_nowcast.py ก็ได้ครับ)
          command: kv key put nowcast/latest.json --path=./dist_nowcast/nowcast_metadata.json --namespace-id=${{ secrets.CF_KV_NAMESPACE_ID }}