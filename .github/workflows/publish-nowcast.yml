name: Publish experimental nowcast to KV

on:
  workflow_dispatch:
  # Enable only after the nowcast generation script is stable and tested.
  # schedule:
  #   - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Generate nowcast JSON
        run: python update_nowcast.py
        # ADAPT THIS: replace with the real nowcast script/command you use.
        # It must create output/nowcast.json. Do not commit generated output to Git.

      - name: Validate nowcast output
        shell: bash
        run: |
          set -euo pipefail
          test -s output/nowcast.json || { echo 'Missing output/nowcast.json; change the generation command or output path.'; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('output/nowcast.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          if not isinstance(data, (dict, list)):
              raise SystemExit('Nowcast JSON must contain an object or array')
          print(f'Valid JSON: {p.stat().st_size} bytes')
          if p.stat().st_size > 25 * 1024 * 1024:
              raise SystemExit('KV value exceeds the 25 MiB per-value limit')
          PY

      - name: Write the latest nowcast to Workers KV
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: kv key put nowcast/latest.json --path=output/nowcast.json --namespace-id=${{ secrets.NOWCAST_KV_NAMESPACE_ID }}
