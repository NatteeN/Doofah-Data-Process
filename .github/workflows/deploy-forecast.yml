name: Process and deploy ECMWF forecast

on:
  push:
    branches: [main]
  workflow_dispatch:
  # After a successful manual test, you may enable a schedule.
  # GitHub cron uses UTC. Example 02:30, 08:30, 14:30, 20:30 UTC = 09:30, 15:30, 21:30, 03:30 Thailand time.
  schedule:
    - cron: '30 2,8,14,20 * * *'

permissions:
  contents: read
  deployments: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run forecast pipeline
        run: python update_data.py
        # IMPORTANT: If your actual script needs command-line options or a different path,
        # change this line to match your repository. Keep generated files out of git.

      - name: Validate and add CORS/cache headers
        shell: bash
        run: |
          set -euo pipefail
          test -f public/metadata.json || { echo 'Missing public/metadata.json; check update_data.py output directory.'; exit 1; }
          cat > public/_headers <<'HEADERS'
          /*
            Access-Control-Allow-Origin: *
            Access-Control-Allow-Methods: GET, HEAD, OPTIONS
            Access-Control-Allow-Headers: Content-Type
            Cache-Control: public, max-age=60
          HEADERS

      - name: Deploy forecast files to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=doofah-forecast-data
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
