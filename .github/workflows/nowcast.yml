name: DooFah Satellite Nowcast Pipeline

on:
  schedule:
    # รันทุกๆ 15 นาที (96 รอบ/วัน ใช้โควตา KV เพียง 192 Writes/วัน จากฟรี 1,000 Writes)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-nowcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Install Python Dependencies
        run: |
          pip install numpy scipy matplotlib geojsoncontour boto3 opencv-python-headless requests

      - name: 4. Run Himawari-9 Nowcast Engine
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          python update_nowcast.py